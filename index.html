<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keeper">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Keeper</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}
  body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;justify-content:center;
       padding-bottom:90px;overflow-x:hidden}
  .app{width:100%;max-width:430px;padding:14px 16px 100px;position:relative}
  .grabber{width:40px;height:4px;background:#2c2c2e;border-radius:2px;margin:0 auto 10px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
  .top .ico{width:36px;height:36px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;
            justify-content:center;font-size:16px;cursor:pointer;color:#ccc}
  .top .chip{background:#1c1c1e;padding:6px 12px;border-radius:20px;font-size:14px;color:#ccc;
             display:flex;align-items:center;gap:6px}
  .balance{text-align:center;margin:8px 0 6px}
  .balance .amount{font-size:44px;font-weight:700;letter-spacing:-1.5px;display:flex;
                   justify-content:center;align-items:baseline;gap:6px}
  .balance .amount .bolt{font-size:22px;color:#5b8def}
  .balance .addr{color:#8a8a8e;font-size:13px;margin-top:6px;display:flex;
                 justify-content:center;align-items:center;gap:6px}
  .actions{display:flex;justify-content:space-between;margin:20px 6px}
  .act{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;
       gap:6px;cursor:pointer;font-family:inherit}
  .act .circle{width:52px;height:52px;border-radius:50%;background:#1c1c1e;display:flex;
               align-items:center;justify-content:center;font-size:20px;color:#fff}
  .act .lbl{font-size:12px;color:#c9c9cc}
  .block{background:#1c1c1e;border-radius:16px;padding:14px;margin-bottom:14px}
  .block .ttl{font-size:14px;color:#fff;font-weight:600;margin-bottom:10px}
  .block .row{display:flex;align-items:center;gap:12px;padding:10px 0}
  .block .row .ico{width:38px;height:38px;border-radius:50%;background:#3a2a10;display:flex;
                   align-items:center;justify-content:center;font-size:18px}
  .block .row .txt{flex:1;font-size:14px;color:#fff}
  .block .row .arr{color:#8a8a8e}
  .crypto-head{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 10px}
  .crypto-head .l{font-size:15px;font-weight:600}
  .crypto-head .r{font-size:13px;color:#8a8a8e}
  .asset{background:#141416;border-radius:16px;padding:14px;margin-bottom:8px;
         display:flex;align-items:center;gap:12px}
  .asset .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
             justify-content:center;font-size:18px;font-weight:700;color:#fff}
  .ic.gram{background:linear-gradient(135deg,#4a90e2,#2c5fbf)}
  .ic.usdt{background:linear-gradient(135deg,#26A17B,#1a7a5c)}
  .ic.usde{background:linear-gradient(135deg,#0a3d2a,#052018)}
  .asset .info{flex:1;min-width:0}
  .asset .ticker{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .asset .badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
  .badge.green{background:rgba(37,181,90,0.18);color:#25b55a}
  .badge.grey{background:#2c2c2e;color:#8a8a8e}
  .asset .sub{font-size:12px;color:#8a8a8e;margin-top:4px}
  .asset .sub b{color:#25b55a;font-weight:600}
  .asset .amt{text-align:right}
  .asset .amt .v{font-size:15px;font-weight:600}
  .asset .amt .f{font-size:12px;color:#8a8a8e;margin-top:4px}
  .tabs{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
        background:#0a0a0a;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;
        padding:10px 0 20px}
  .tab{flex:1;text-align:center;color:#8a8a8e;font-size:11px;cursor:pointer}
  .tab.active{color:#4a90e2}
  .tab .ic{font-size:20px;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="app">
  <div class="grabber"></div>
  <div class="top">
    <div class="ico">←</div>
    <div class="chip">V5 ▾</div>
    <div style="display:flex;gap:10px">
      <div class="ico">⏱</div>
      <div class="ico">⚙</div>
    </div>
  </div>
  <div class="balance">
    <div class="amount" id="amount">$38,070.96 <span class="bolt">⚡</span></div>
    <div class="addr">UQAY…Rdxs ⧉</div>
  </div>
  <div class="actions">
    <button class="act"><div class="circle">↑</div><div class="lbl">Send</div></button>
    <button class="act"><div class="circle">↓</div><div class="lbl">Add Funds</div></button>
    <button class="act"><div class="circle">⇅</div><div class="lbl">Swap</div></button>
    <button class="act"><div class="circle">📊</div><div class="lbl">Stake</div></button>
  </div>
  <div class="block">
    <div class="ttl">Finish setting up</div>
    <div class="row">
      <div class="ico">🔑</div>
      <div class="txt">Back up the wallet recovery phrase</div>
      <div class="arr">›</div>
    </div>
  </div>
  <div class="crypto-head">
    <div class="l">Crypto</div>
    <div class="r">Manage ⇄</div>
  </div>
  <div class="asset">
    <div class="ic gram">⟠</div>
    <div class="info">
      <div class="ticker">GRAM <span class="badge green">12.87% APY</span></div>
      <div class="sub">$1.46 <b>+4.63%</b></div>
    </div>
    <div class="amt">
      <div class="v">26,061.16</div>
      <div class="f">$38,070.96</div>
    </div>
  </div>
  <div class="asset">
    <div class="ic usdt">₮</div>
    <div class="info">
      <div class="ticker">USDT <span class="badge grey">TON</span></div>
      <div class="sub">$1 <span style="color:#e35d5d">-0.02%</span></div>
    </div>
    <div class="amt"><div class="v">0</div><div class="f">$0</div></div>
  </div>
  <div class="asset">
    <div class="ic usde">$</div>
    <div class="info">
      <div class="ticker">USDe <span class="badge grey">TON</span></div>
      <div class="sub">$1 <b>+0.01%</b></div>
    </div>
    <div class="amt"><div class="v">0</div><div class="f">$0</div></div>
  </div>
  <div class="tabs">
    <div class="tab active"><span class="ic">▣</span>Wallet</div>
    <div class="tab"><span class="ic">📈</span>Trade</div>
    <div class="tab"><span class="ic">🌐</span>Browser</div>
  </div>
</div>
<script>
document.addEventListener('click', () => { if (navigator.vibrate) navigator.vibrate(6); });
let base = 38070.96;
const el = document.getElementById('amount');
setInterval(() => {
  base += Math.random() * 3 - 1.2;
  el.innerHTML = '$' + base.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' <span class="bolt">⚡</span>';
}, 3000);
</script>
</body>
</html>
